<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kenttami.es</title>
<meta name="description" content="now i know you visited.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="stylesheets/styles.css">
</head>
<body>
<main><p id="msg"></p></main>
<h1 id="n">000001</h1>
<script>
// The storyline: from visit `from` onwards, show `text`.
var STORY = [
  { from: 6,  text: 'still here...?' },
  { from: 11, text: 'you really like this page, huh..' }
];

// Counts this visitor's visits in their own browser. Nothing is sent anywhere.
(function () {
  var n = 1;
  try {
    n = (parseInt(localStorage.getItem('visits'), 10) || 0) + 1;
    localStorage.setItem('visits', n);
  } catch (e) {}

  document.getElementById('n').textContent = String(n).padStart(6, '0');
  document.title = n + ' — kenttami.es';

  var text = '';
  STORY.forEach(function (s) { if (n >= s.from) text = s.text; });
  if (text) {
    document.getElementById('msg').textContent = text;
    document.documentElement.classList.add('story');
  }
})();
</script>
</body>
</html>
