<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kenttami.es</title>
<meta name="description" content="now i know you visited.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="stylesheets/styles.css">
</head>
<body>
<main><p id="msg"></p></main>
<h1 id="n">000001</h1>
<script>
// The storyline: on visit `at`, show `text` for that one visit only.
// From the first message onwards the counter sits at the bottom.
var STORY = [
  { at: 6,  text: 'still here...?' },
  { at: 11, text: 'you really like this page, huh..' }
];

// Counts this visitor's visits in their own browser. Nothing is sent anywhere.
(function () {
  var n = 1;
  try {
    n = (parseInt(localStorage.getItem('visits'), 10) || 0) + 1;
    localStorage.setItem('visits', n);
  } catch (e) {}

  document.getElementById('n').textContent = String(n).padStart(6, '0');
  document.title = n + ' — kenttami.es';

  STORY.forEach(function (s) {
    if (n === s.at) document.getElementById('msg').textContent = s.text;
  });
  if (n >= STORY[0].at) document.documentElement.classList.add('story');
})();
</script>
</body>
</html>
