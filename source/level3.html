<script>
// Level 3: counting with fingers.
// Refreshing does nothing. Each digit is a dial: tap it and it goes up by one, 9 wraps to 0.
// Nothing carries by itself, so going from 9 to 10 means tapping the dial on the left yourself.
// A wrong tap stays wrong: dials only go up, so you have to tap your way back round.
// The game is a patient, slightly condescending teacher. It ends at 42.
//
// Flow: teach the dials from 0 to 20 (carrying, the 13-19 distraction, the 19 trap),
// then a pop quiz answered on the same dials: simple sums, then years, then
// "what is the meaning of life?" -> 42.
//
// Older phases, switched off for now (their numbers are set to Infinity below):
//   0-22   normal dials
//   23-30  blindfold: every digit shows "?", you count from memory. it comes off at 31.
//   32-41  randomizer: a tap shows a random digit. the right one is rigged to come up within
//          3-8 taps, with a confetti burst from that dial; a finished number gets a big
//          confetti-and-lasers blast. tapping a dial that was already right scrambles it.

var GOAL = 42;
var QUIZ_FROM = 20;              // the count where teaching ends and the quiz starts
var QUIZ_INTRO = "ok, you can count. barely. pop quiz!";
var THIS_YEAR = new Date().getFullYear();
var QUIZ = [
  // simple sums
  { q: "what's 2 + 2?", a: 4, h: ['count on your fingers. you have ten.', "it's 4, sweetie."] },
  { q: '7 + 5?', a: 12, h: ['more than ten. remember carrying the one?', 'twelve.'] },
  { q: '15 - 6?', a: 9, h: ['take six away from fifteen.', "nine. it's nine."] },
  // notes: remarks under the question at fixed times (seconds) after it appears. the normal hints wait until after them.
  { q: '3 \u00D7 8?', a: 24, h: ['three eights. or eight threes.', 'twenty-four.'],
    notes: [[0, "maths, and nobody's even grading you."], [5, "you'll need more than 10 fingers for this one."], [10, "you'll need your toes also. maybe."]] },
  // years
  { q: 'now some history. answers are years. what year did people first walk on the moon?', a: 1969, h: ['the late sixties. big dials too, sweetie.', '1969.'] },
  { q: 'the titanic sank in...', a: 1912, h: ['early 1900s. it was very cold.', '1912.'] },
  { q: 'the berlin wall came down in...', a: 1989, h: ['the late eighties.', '1989.'] },
  { q: 'the first iphone came out in...', a: 2007, h: ['the 2000s. before phones were your whole personality.', '2007.'] },
  { q: 'and what year is it now?', a: THIS_YEAR, h: ['look at a calendar, sweetie.', String(THIS_YEAR) + '.'] },
  // the last one
  // the twist: the last dial has no 2, and gets an empty slot after 9. so a plain 000042 can't
  // be made: the answer is 42 one place to the left, with the empty slot last: 0 0 0 4 2 [ ].
  // flip: a hint shown once the player has been tapping on this question for that many seconds.

var SLOT_NO_TWO = 'huh. where did the 2 go?';

var BACK_PAUSE_MS = 2000;       // then this much longer before "go back"

  0: "level 3. today we're learning to count.",

  2: "two. you're a natural.",

  4: 'four. that\'s one more than three. math!',

  25: 'mm-hm.',
  26: "i can't see it either, if that helps.",

  33: 'thirty-three. got there eventually.',
  34: "the dials are just guessing now. so are you.",

var BLIND_AGAIN = 'back on track. blindfold back on.';

// lock

var LOCK_SHOWS = '\uD83D\uDD12';           // the lock symbol on the extra dial
var LOCK_NEW = 'new rule. lock it in first. the empty one, on the right.';
var LOCK_FIRST = 'lock it in first, sweetie.';
var LOCKED = 'locked. now the two next to it.';
var LOCK_AGAIN = 'again. lock first.';
// chatter while counting 13-19, every few seconds, to pull attention away
var CHATTER_FROM = 13, CHATTER_UNTIL = 20, CHATTER_MS = 5500;
var CHATTER = [
  'the bus driver had a moustache. a big one.',
  'not important. just a very big moustache.',
  'have you ever had a really good sandwich?',
  'anyway.',
  'wait, what number are we on?',
  "don't answer that. i'm testing you."
];
// falling for the trap at 19
var TRAP_TWENTY = "twenty. eventually. that's what you get for listening to me.";
var TRAP_OTHER = function (v) { return 'HA. gotcha. ' + v + "? not so good at counting when someone's talking, huh."; };
var WRONG_HINTS = { 2: 'dials only go one way. round and round.', 4: "9, then 0, then back where it was. you'll get there.",
                    7: 'tsk.', 10: 'slowly. like we practised.' };
var FIXED = "there we go. let's never do that again.";
// straying: more than 15 wrong taps while learning to count. a "get back to counting" line,
// then a "you were on n" line, alternating every few more wrong taps.
var STRAY_AFTER = 16, STRAY_EVERY = 4;
var STRAY_BACK = [
  "ok, free play is over. back to counting, please.",
  "this isn't a slot machine, sweetie. we're counting.",
  'fascinating. none of those are the next number.',
  "you're just tapping things now. i can tell."
];
var STRAY_WHERE = [
  'we were on {n}. remember {n}? good times.',
  "you were on {n}. the next one is {next}. that's the whole game.",
  "{n}. you were on {n}. i'll write it down for you.",
  "it's the number after {n}. you've got this. probably."
];
var NAMES = ['hundred-thousands', 'ten-thousands', 'thousands', 'hundreds', 'tens', 'ones'];

(function () {
  var msg = document.getElementById('msg');
  var sub = document.getElementById('sub');
  var counter = document.getElementById('n');
  var dials = counter.children;
  var home = document.getElementById('home');
  var startBtn = document.getElementById('start');
  var resumeBtn = document.getElementById('resume');

  var saidAt = 0;
  function say(text) {
    if (text === undefined || msg.textContent === text) return;
    saidAt = Date.now();
    msg.textContent = text;
    msg.style.animation = 'none';
    void msg.offsetWidth;
    msg.style.animation = '';
  }
  function value() {
    if (s.digits.some(function (d) { return d === null; })) return NaN;
    return parseInt(s.digits.join(''), 10);
  }
  function phase() {
    if (s.q !== undefined && s.q !== null && s.q >= 0 && s.count < GOAL) return 'quiz';
    if (s.count >= LOCK_FROM && s.count < GOAL) return 'lock';
    if (s.count >= RANDOM_FROM && s.count < RANDOM_UNTIL) return 'random';
    if (s.count >= BLIND_FROM && s.count < BLIND_UNTIL) return 'blind';
    return 'normal';
  }
  function paint() {

    for (var i = 0; i < 6; i++) {
      dials[i].textContent = shown[i];
      dials[i].setAttribute('aria-label', NAMES[i] + ' dial, showing ' + (hidden ? 'hidden' : shown[i]));
    }
    if (phase() === 'lock') {
      var lock = lockDial();
      lock.textContent = s.lock === 'locked' ? LOCK_SHOWS : s.lockSpin === null || s.lockSpin === undefined ? '\u00A0' : String(s.lockSpin);

  }
  // the extra dial for the lock phase, made on demand
  function lockDial() {

  }

  }

  if (!levelDone(2)) {
    say('nice try. finish level 2 first.');
    consent(function () { track('l3_locked'); });
    return;
  }

  if (!level3Open()) {
    var showCountdown = function () {
      if (level3Open()) return location.reload();

    consent(function () { track('l3_countdown_view'); });

  if (!s.spin) s.spin = [0, 0, 0, 0, 0, 0, 0];    // randomizer: taps until each dial lands right
  if (!s.lock) s.lock = 'open';
  if (s.taps > 0) s.agreed = true;   // saves from before the warning existed

  var starting = takeFlag('l3start');

  // finished earlier and nothing in progress: done screen
  if (cameBack && levelDone(3) && s.count < GOAL && s.agreed) {
    paint();

    consent(function () { track('level_done_view', { level: 3 }); });
    return;
  }

  paint();
  if (s.count >= GOAL) return finished(false);

  // a fresh start asks first: "level 3 is difficult..."
  var warn = document.getElementById('warn');
  var opened = Date.now();

    document.getElementById('nope').addEventListener('click', function () {
      track('l3_warning', { answer: 'no' });
      location.href = '../';
    });

      track('l3_warning', { answer: 'yes' });

      store();

  } else if (!openedFresh() && !starting && !continuing) {

  } else {
    say(SCRIPT[s.count] || '');
  }
  if (phase() === 'quiz' && !openedFresh() && !starting && !continuing) setTimeout(function () { askQuestion(true); }, 2500);
  else if (phase() === 'quiz') { if (!s.qStart) { s.qStart = Date.now(); store(); } playNotes(s.q); }

  // ---- the quiz: answer by setting the dials. a correct answer moves on by itself. ----
  var hintIndex = 0, lastQuizTap = Date.now();

    say(QUIZ_INTRO);
    setTimeout(askQuestion, 2200);
  }
  function askQuestion(resumed) {
    if (phase() !== 'quiz') return;
    hintIndex = 0;
    lastQuizTap = Date.now();

  // timed remarks for a question; after a refresh, picks up with the one that's due
  function notesEnd(item) { return item.notes ? item.notes[item.notes.length - 1][0] * 1000 : 0; }

  // every hint or remark goes through here, so the timers can count from the latest one

  // reactions to what the player does: shown at once, or queued until 5 seconds after the last hint
  function hintNote(text) {

    pumpNotes();
  }
  function pumpNotes() {
    clearTimeout(noteTimer);

    var wait = lastNoteAt + HINT_GAP_MS - Date.now();
    if (wait > 0) { noteTimer = setTimeout(pumpNotes, wait); return; }
    var next = noteQueue.shift();
    if (phase() === 'quiz' && s.q === next.q && !answered(QUIZ[s.q])) quizNote(next.text);

    quizNote(last ? '' : QUIZ_YES[(s.q - 1) % QUIZ_YES.length]);
    store();
    if (last) {
      s.count = GOAL;
      store();
      setTimeout(function () { finished(true); }, 900);
    } else {
      setTimeout(askQuestion, 1700);
    }
  }
  // hints: one every 10 seconds while the answer isn't there, tapping or not, at least 5 s after any other line
  setInterval(function () {
    if (phase() !== 'quiz' || !s.agreed || document.visibilityState !== 'visible') return;
    var item = QUIZ[s.q];
    if (!item || answered(item)) return;
    var now = Date.now();
    if (now - lastNoteAt < HINT_GAP_MS || noteQueue.length) return;
    // the 15 seconds of tapping start again whenever another hint shows up
    var tappingSince = Math.max(s.qFirstTap || 0, lastNoteAt);
    if (item.flip && !s.flipShown && s.qFirstTap && now - tappingSince >= item.flip.after * 1000) {
      s.flipShown = true;
      store();
      quizNote(item.flip.text);
      lastQuizTap = Date.now();
      return;
    }
    if (hintIndex >= item.h.length) return;
    if (now - Math.max(s.qStart || 0, lastNoteAt) < HINT_AFTER_MS) return;
    if (Date.now() - (s.qStart || 0) < notesEnd(item) + HINT_AFTER_MS) return;   // let the remarks finish first
    quizNote(item.h[hintIndex++]);
    lastQuizTap = Date.now();
  }, 1000);

  // ---- confetti and lasers, drawn on a canvas over the page ----
  var COLORS = ['#39ff14', '#ffd34d', '#ff4d6d', '#4dd2ff', '#c77dff', '#ffffff'];
  var calmMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fx = null, bits = [], beams = [], fxRunning = false;
  function fxCanvas() {
    if (fx) return fx;
    fx = document.createElement('canvas');
    fx.className = 'fx';
    fx.setAttribute('aria-hidden', 'true');
    document.body.appendChild(fx);
    return fx;
  }
  function burst(x, y, count, power) {
    for (var k = 0; k < count; k++) {
      var a = Math.random() * Math.PI * 2, v = (2 + Math.random() * 5) * power;
      bits.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3 * power, life: 1,
                  w: 4 + Math.random() * 5, h: 2 + Math.random() * 4, r: Math.random() * 6, vr: Math.random() * 0.4 - 0.2,
                  c: COLORS[k % COLORS.length], spark: Math.random() < 0.3 });
    }
    runFx();
  }
  function lasers(x, y, count) {
    for (var k = 0; k < count; k++) beams.push({ x: x, y: y, a: (k / count) * Math.PI * 2 + Math.random() * 0.3, life: 1, c: COLORS[k % COLORS.length] });
    runFx();
  }
  function runFx() {
    if (fxRunning) return;
    fxRunning = true;
    var c = fxCanvas(), g = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    (function step() {
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, innerWidth, innerHeight);
      beams = beams.filter(function (b) {
        b.life -= 0.045;
        var len = Math.max(innerWidth, innerHeight) * (1.1 - b.life);
        g.globalAlpha = Math.max(0, b.life);
        g.strokeStyle = b.c; g.lineWidth = 3; g.shadowColor = b.c; g.shadowBlur = 12;
        g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x + Math.cos(b.a) * len, b.y + Math.sin(b.a) * len); g.stroke();
        return b.life > 0;
      });
      g.shadowBlur = 0;
      bits = bits.filter(function (p) {
        p.vy += 0.18; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.012;
        g.globalAlpha = Math.max(0, p.life);
        g.fillStyle = p.c;
        if (p.spark) { g.beginPath(); g.arc(p.x, p.y, 2, 0, Math.PI * 2); g.fill(); }
        else { g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); }
        return p.life > 0 && p.y < innerHeight + 20;
      });
      g.globalAlpha = 1;
      if (bits.length || beams.length) requestAnimationFrame(step);
      else { g.clearRect(0, 0, innerWidth, innerHeight); fxRunning = false; }
    })();
  }
  function centerOf(el) { var r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  function pop(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  // a dial landed on the right digit: small burst, and it stays lit
  function celebrateDial(i) {
    dials[i].classList.add('landed');
    pop(dials[i], 'pop');
    if (!calmMotion) { var c = centerOf(dials[i]); burst(c[0], c[1], 45, 1); }
  }
  // a whole number done: big burst and lasers from the counter
  function celebrateNumber(final) {
    pop(counter, 'cheer');
    if (calmMotion) return;
    var c = centerOf(counter);
    lasers(c[0], c[1], final ? 16 : 10);
    burst(c[0], c[1], final ? 260 : 120, final ? 1.8 : 1.3);
    if (final) setTimeout(function () { burst(innerWidth * 0.2, innerHeight * 0.35, 120, 1.5); burst(innerWidth * 0.8, innerHeight * 0.35, 120, 1.5); }, 350);
  }
  function clearLanded() { for (var k = 0; k < dials.length; k++) dials[k].classList.remove('landed'); }

  // randomizer / lock: spin a dial. the right digit comes up after 3-8 taps.
  function spinTo(i, want) {
    if (s.digits[i] === want) {            // it was already right: scramble it
      s.digits[i] = randomOther(want);
      s.spin[i] = 0;
      return 'scrambled';
    }
    if (!s.spin[i]) s.spin[i] = rand(SPIN_MIN, SPIN_MAX);
    s.spin[i]--;
    if (s.spin[i] <= 0) { s.digits[i] = want; s.spin[i] = 0; return 'landed'; }
    s.digits[i] = randomOther(want, s.digits[i]);
    return 'missed';
  }

  function tapRandom(i) {
    if (phase() === 'lock') {
      if (i === 6) {
        if (s.lock === 'locked') return;
        if (!s.spin[6]) s.spin[6] = rand(SPIN_MIN, SPIN_MAX);
        s.spin[6]--;
        if (s.spin[6] <= 0) {
          s.lock = 'locked';
          s.spin[6] = 0;
          s.digits[4] = null; s.digits[5] = null;   // the two next to it start empty
          say(LOCKED);
          log('l3_locked_in', { count: s.count });
        } else {
          s.lockSpin = randomOther(s.lockSpin);
        }
        paint(); store();
        return;
      }
      if (s.lock !== 'locked') { say(LOCK_FIRST); wiggle(6); return; }
    }
    var result = spinTo(i, target()[i]);
    paint();
    if (result === 'landed') celebrateDial(i);
    if (result === 'scrambled') dials[i].classList.remove('landed');
    if (value() === s.count + 1) {
      celebrateNumber(s.count + 1 >= GOAL);
      setTimeout(clearLanded, 700);
      return advance(s.count + 1);
    }
    if (result === 'scrambled') say(SCRAMBLED);
    else if (!s.randomSeen) { s.randomSeen = true; say(RANDOM_FIRST); }
    else if (result === 'missed' && Math.random() < 0.35) say(RANDOM_MISS[rand(0, RANDOM_MISS.length - 1)]);
    store();
  }

  function tap(i) {
    if (s.count >= GOAL || !s.agreed) return;
    if (!s.taps) log('l3_first_tap', { seconds: Math.round((Date.now() - opened) / 1000) });
    s.taps++;
    dials[i].classList.add('press');
    setTimeout(function () { dials[i].classList.remove('press'); }, 90);
    if (phase() === 'quiz') return tapQuiz(i);
    if (phase() === 'random' || phase() === 'lock') return tapRandom(i);

    s.digits[i] = (s.digits[i] + 1) % 10;
    var v = value();
    paint();

    if (v === s.count + 1) {
      if (s.count % 10 === 9) log('l3_carry', { to: v, wrong_taps: s.wrong });
      return advance(v);
    }

    s.wrong++;
    s.wrongTotal++;
    if (s.count === 19 && !s.trapped) { s.trapped = true; log('l3_trapped'); }
    var carry = carryState();
    if (phase() === 'blind') {
      // blindfolded: no specific hints, just a feeling. after a few, a peek.
      if (v === s.count) { if (s.peek) { s.peek = false; say(BLIND_AGAIN); paint(); } s.wrong = 0; }
      else if (s.wrong === 1) say(BLIND_WRONG);
      else if (s.wrong === PEEK_AFTER && !s.peek) { s.peek = true; say(PEEK); paint(); log('l3_peek', { count: s.count }); }
    } else if (v === s.count) {
      say(FIXED);
      s.wrong = 0;
    } else if (s.count < QUIZ_FROM && s.wrong >= STRAY_AFTER && (s.wrong - STRAY_AFTER) % STRAY_EVERY === 0) {
      var turn = (s.wrong - STRAY_AFTER) / STRAY_EVERY;
      var lines = turn % 2 === 0 ? STRAY_BACK : STRAY_WHERE;
      say(lines[Math.floor(turn / 2) % lines.length].replace(/\{n\}/g, s.count).replace(/\{next\}/g, s.count + 1));
      if (turn % 2 === 1) {
        // wiggle the dial that's showing the wrong digit
        var want = String(s.count + 1).padStart(6, '0');
        for (var w = 0; w < 6; w++) if (String(s.digits[w]) !== want[w]) { wiggle(w); break; }
      }
      if (turn === 0) log('l3_strayed', { count: s.count });
    } else if (carry !== null && CARRY_HINTS[s.count]) {
      var hints = CARRY_HINTS[s.count];
      var n = s.wrong - 1;          // the wrap itself is wrong tap 0
      if (carry > 0 && s.count < 29) say('we did ' + v + ' already, sweetie. ages ago.');
      if (hints[n] !== undefined) say(hints[n]);
      if (hints.w !== undefined && n >= hints.w) wiggle(4);
    } else if (s.wrong === 1 && s.count === 19) {
      say(TRAP_OTHER(v));
    } else if (s.wrong === 1) {
      var big = s.digits.slice(0, 4).some(function (d, k) { return d !== +String(s.count).padStart(6, '0')[k]; });
      if (big) say('that dial is for grown-ups.');
      else if (v > s.count) say(v + '? we skipped ' + (v - s.count - 1) + ' whole number' + (v - s.count - 1 === 1 ? '' : 's') + '. that\'s cheating.');
      else say(v + '? that\'s going backwards, sweetie.');
      log('l3_wrong', { from: s.count, to: v });
    } else if (WRONG_HINTS[s.wrong]) {
      say(WRONG_HINTS[s.wrong]);
    }
    store();
  }

  function hookDial(el, i) {
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.addEventListener('click', function () { tap(i); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(i); }
    });
  }
  for (var d = 0; d < 6; d++) hookDial(dials[d], d);
  paint();

  // after a refresh in the randomizer, dials that already landed light up again
  if (phase() === 'random') {
    var was = String(s.count).padStart(6, '0').split('').map(Number), want = target();
    for (var k = 0; k < 6; k++) if (s.digits[k] === want[k] && want[k] !== was[k]) dials[k].classList.add('landed');
  }

  // the teacher rambles between 13 and 19, without talking over a fresh line
  var chatterIndex = 0;
  setInterval(function () {
    if (!s.agreed || s.count < CHATTER_FROM || s.count >= CHATTER_UNTIL || s.wrong > 0) return;
    if (document.visibilityState !== 'visible' || Date.now() - saidAt < CHATTER_MS - 500) return;
    say(CHATTER[chatterIndex++ % CHATTER.length]);
  }, 1000);

  function finished(justNow) {
    markDone(3);
    if (dials.length > 6) counter.removeChild(dials[6]);
    if (justNow) {
      log('l3_done', { taps: s.taps, wrong_taps: s.wrongTotal });
      counter.classList.add('win');
    }
    say(QUIZ_FINAL);
    sub.hidden = true;
    Array.prototype.forEach.call(dials, function (el) { el.removeAttribute('role'); el.removeAttribute('tabindex'); });
    counter.classList.remove('dials');
    // "level 3 done." fades in after a pause, then "go back" a little later
    // (both straight away when reopening a finished level)
    setTimeout(function () {
      sub.textContent = 'level 3 done.';
      sub.classList.add('later');
      sub.hidden = false;
    }, justNow ? END_PAUSE_MS : 0);
    setTimeout(function () {
      home.classList.add('later');
      home.hidden = false;
    }, justNow ? END_PAUSE_MS + BACK_PAUSE_MS : 0);
  }

  consent(function () {
    track('l3_view', { count: s.count });
    events.forEach(function (e) { track(e[0], e[1]); });
  });
})();
</script>
</body>
</html>
